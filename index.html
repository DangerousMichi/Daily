<!DOCTYPE html>

    <title>Daily</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="cont">
        <p id="titt">Daily</p>
        <div id="main">
            <div id="buttonD">
                <button id="addNotebook">+ Añadir Notebook</button>
            </div>
            
            <div id="notebooksContainer">
                <!-- Aquí se agregarán los notebooks dinámicamente -->
            </div>
        </div>

            <textarea id="noteContent"></textarea>
            <button id="saveNotebook">Guardar</button>

        </div>
    </div>

    <div id="menuContainer">
        <div id="menuToggle">☰</div>
        <div id="menuContent">
            <input type="color" id="defaultColor" value="#b6ecff">
            <label for="defaultColor">Fondo</label>
            <input type="color" id="defaultFontColor" value="#000000">
            <label for="defaultFontColor">Fuente</label>
        </div>
    </div>

    <script src="funtion.js"></script>
